<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="description" content="마중 차량이 도착하는 위치와 탑승 안내를 지도로 보여 주는 동승자용 페이지입니다." />
<title>마중, 동승자 안심 웹</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
/* Hallmark · v2.0.0 · shape: app screen · genre: modern-minimal · theme: Wayfind refined to Pleos chrome (direction A) · brand: Hyundai hue 258 · built: majung passenger web */
/* Hallmark · waive 24b · plate padding · the plate number needs 10px vertical padding to match the licence plate proportions on the passenger page */
:root {
  color-scheme: light;
  --color-paper: oklch(97.5% 0.004 250);
  --color-paper-2: oklch(93.5% 0.006 250);
  --color-paper-3: oklch(99.3% 0.002 250);
  --color-ink: oklch(17% 0.012 262);
  --color-ink-2: oklch(30% 0.012 262);
  --color-muted: oklch(49% 0.014 260);
  --color-rule: oklch(87% 0.008 250);
  --color-accent: oklch(53% 0.21 258);
  --color-accent-ink: oklch(99.3% 0.002 250);
  --color-go: oklch(50% 0.14 155);
  --color-go-ink: oklch(99.3% 0.002 250);
  --color-stop: oklch(55% 0.2 28);
  --color-stop-ink: oklch(99.3% 0.002 250);
  --color-amber: oklch(81% 0.16 82);
  --color-focus: var(--color-accent);
  --font-body: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --radius-card: 12px;
  --radius-ctl: 10px;
  --radius-plate: 8px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --dur: 120ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--color-accent); color: var(--color-accent-ink); }
html { scrollbar-color: var(--color-rule) var(--color-paper); }
html, body { overflow-x: clip; background: var(--color-paper); }
body {
  font-family: var(--font-body);
  color: var(--color-ink);
  line-height: 1.45;
  min-height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--color-paper);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.top { display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) var(--space-md); background: var(--color-paper); }
.top b { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.live { font-size: 13px; font-weight: 600; padding: 4px var(--space-sm); border: 1px solid var(--color-rule); border-radius: 999px; background: var(--color-paper-3); color: var(--color-ink); }
.live.on { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.map-wrap { position: relative; flex: 1 1 auto; min-height: 44dvh; border-top: 1px solid var(--color-rule); border-bottom: 1px solid var(--color-rule); background: var(--color-paper-2); }
#map { position: absolute; inset: 0; background: var(--color-paper-2); font-family: var(--font-body); }
.leaflet-container { font-family: var(--font-body); background: var(--color-paper-2); }
.leaflet-container a { color: var(--color-accent); }
.leaflet-control-attribution { background: var(--color-paper-3); color: var(--color-muted); font-size: 10px; }
.sheet { display: grid; gap: var(--space-sm); padding: var(--space-md); padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom, 0px)); background: var(--color-paper-3); }
.say { display: grid; gap: 4px; }
.say.go { background: var(--color-go); color: var(--color-go-ink); padding: var(--space-md); border-radius: var(--radius-card); }
.say.stop { background: var(--color-stop); color: var(--color-stop-ink); padding: var(--space-md); border-radius: var(--radius-card); }
.head { font-weight: 700; font-size: 24px; line-height: 1.15; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.sub { font-size: 14px; line-height: 1.45; }
.say:not(.go):not(.stop) .sub { color: var(--color-muted); }
.note { font-size: 14px; font-weight: 600; }
.plate-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--space-md); }
.num { font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; padding: 10px var(--space-md); background: var(--color-paper-3); color: var(--color-ink); border: 1px solid var(--color-ink); border-radius: var(--radius-plate); letter-spacing: 0.04em; }
.car { display: grid; gap: 2px; min-width: 0; }
.car b { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.car span { font-size: 13px; color: var(--color-muted); }
.chips { display: grid; gap: var(--space-xs); }
.chip { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs); min-height: 52px; padding: 0 var(--space-md); font-size: 16px; font-weight: 600; text-align: left; border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper-3); color: var(--color-ink); cursor: pointer; transition: background-color var(--dur) steps(1); }
.chip span { font-size: 13px; font-weight: 500; color: var(--color-muted); }
.chip:hover { background: var(--color-paper-2); }
.chip.sent { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.chip.sent span { color: var(--color-accent-ink); }
.chip:active { transform: translateY(1px); }
.chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; transition: none; }
.chip:disabled, .btn:disabled { opacity: .55; cursor: not-allowed; }
.small { font-size: 13px; color: var(--color-muted); }
.small.err { color: var(--color-stop); font-weight: 600; }
.btn { min-height: 40px; padding: 0 var(--space-md); font-size: 14px; font-weight: 600; border: 1px solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper-3); cursor: pointer; transition: background-color var(--dur) steps(1); }
.btn:hover { background: var(--color-paper-2); }
.btn:active { transform: translateY(1px); }
.fact { display: flex; justify-content: space-between; align-items: center; padding: var(--space-sm) var(--space-md); background: var(--color-paper); border: 1px solid var(--color-rule); border-radius: var(--radius-card); font-size: 14px; }
.fact b { font-weight: 600; }
.fact b.ok { color: var(--color-go); }
.fact b.bad { color: var(--color-stop); }
.foot { font-size: 12px; color: var(--color-muted); padding: var(--space-sm) var(--space-md) var(--space-md); background: var(--color-paper-3); border-top: 1px solid var(--color-rule); }
.mk-car { width: 30px; height: 30px; border-radius: 50%; background: var(--color-accent); border: 2px solid var(--color-paper-3); display: grid; place-items: center; }
.mk-car svg { width: 16px; height: 16px; fill: var(--color-paper-3); }
.mk-pick { position: relative; width: 24px; height: 24px; background: var(--color-amber); border: 2px solid var(--color-ink); border-radius: 6px; }
.mk-pick i { position: absolute; left: 30px; top: 1px; font-style: normal; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--color-paper-3); color: var(--color-ink); border: 1px solid var(--color-rule); border-radius: 4px; padding: 0 4px; }
.mk-me { width: 12px; height: 12px; border-radius: 50%; background: var(--color-ink); border: 2px solid var(--color-paper-3); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .chip, .btn { transition: none; } .chip:active, .btn:active { transform: none; } }
@media (max-width: 340px) { .num { font-size: 32px; padding: var(--space-xs) var(--space-sm); } .head { font-size: 21px; } }
</style>
</head>
<body>
<header class="top"><b>마중</b><span id="live" class="live">연결 끊김</span></header>
<div id="mapWrap" class="map-wrap"><div id="map"></div></div>
<main class="sheet">
  <section id="say" class="say"><div id="head" class="head">차가 오고 있어요</div><div id="sub" class="sub"></div><div id="note" class="note" hidden></div></section>
  <section class="plate-row">
    <div id="plate" class="num">----</div>
    <div class="car"><b id="model">차종 확인 중</b><span id="carLine">번호판 끝 4자리를 먼저 확인하세요</span></div>
  </section>
  <section id="chips" class="chips">
    <button type="button" class="chip" data-kind="PICKUP_HERE">여기서 태워 주세요<span></span></button>
    <button type="button" class="chip" data-kind="OTHER_SIDE">건너편으로 갈게요<span></span></button>
    <button type="button" class="chip" data-kind="WAIT_MINUTES">2분만 기다려 주세요<span></span></button>
  </section>
  <p id="chipHint" class="small" hidden></p>
  <section id="facts" hidden>
    <div class="fact"><span>조수석 문</span><b id="fDoor">잠김</b></div>
    <div class="fact" style="margin-top:var(--space-xs)"><span>안전벨트</span><b id="fBelt">아직 없음</b></div>
  </section>
  <div id="locBox" class="small" hidden><p>내 위치를 보내지 않아요. 지도에는 차만 보여요.</p><button id="locBtn" type="button" class="btn" style="margin-top:var(--space-xs)">내 위치 공유</button></div>
</main>
<p id="foot" class="foot">이 페이지의 내 위치는 허용한 경우에만 이 세션 동안 차량에 전달되며, 탑승 확인 즉시 사라지고 늦어도 20분 뒤 자동 만료됩니다.</p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  const parts = location.pathname.split("/").filter(Boolean);
  const qs = new URLSearchParams(location.search);
  const sessionId = (parts[0] === "m" && parts[1]) ? parts[1] : (qs.get("s") || "demo-session");
  const api = "/api/v1/sessions/" + encodeURIComponent(sessionId);
  // 공유 링크의 일회성 토큰(?t=). 중계 서버는 이 토큰 없이는 세션 상태·이벤트·제안을 받지 않는다. 주소창 밖으로 내보내지 않는다.
  const token = qs.get("t") || "";
  const withToken = (path) => api + path + (token ? (path.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token) : "");
  const $ = (id) => document.getElementById(id);
  const el = { live: $("live"), say: $("say"), head: $("head"), sub: $("sub"), note: $("note"), plate: $("plate"), model: $("model"),
    carLine: $("carLine"), chips: $("chips"), chipHint: $("chipHint"), facts: $("facts"), fDoor: $("fDoor"), fBelt: $("fBelt"),
    locBox: $("locBox"), locBtn: $("locBtn"), mapWrap: $("mapWrap"), foot: $("foot") };
  let last = {}, shredded = false, stoppedNow = false;

  // ---- map ----
  let map = null, carM = null, pickM = null, meM = null, meC = null;
  const pts = { car: null, pick: null, me: null };   // current {lat,lng}
  const fitted = { car: null, pick: null, me: null }; // position at last fit
  let lastUserAt = 0, lastPickVer = null;
  const hasLeaflet = typeof L !== "undefined";
  if (hasLeaflet) {
    map = L.map("map", { zoomControl: false, attributionControl: true }).setView([37.4988, 127.0614], 16);
    map.attributionControl.setPrefix(false);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
    ["pointerdown", "wheel", "touchstart", "keydown"].forEach((t) => map.getContainer().addEventListener(t, () => { lastUserAt = Date.now(); }, { passive: true }));
  }
  const dist = (a, b) => {
    const R = 6371000, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  function fit(force) {
    if (!map || shredded) return;
    const keys = Object.keys(pts).filter((k) => pts[k]);
    if (!keys.length) return;
    const moved = keys.some((k) => !fitted[k] || dist(fitted[k], pts[k]) > 5);
    if (!force && (!moved || Date.now() - lastUserAt < 10000)) return;
    keys.forEach((k) => { fitted[k] = { lat: pts[k].lat, lng: pts[k].lng }; });
    map.invalidateSize();
    if (keys.length === 1) map.setView([pts[keys[0]].lat, pts[keys[0]].lng], 17, { animate: false });
    else map.fitBounds(L.latLngBounds(keys.map((k) => [pts[k].lat, pts[k].lng])), { padding: [40, 40], maxZoom: 18, animate: false });
  }
  const num = (v) => typeof v === "number" && isFinite(v);
  function updateMarkers(s) {
    if (!map) return;
    if (num(s.carLat) && num(s.carLng)) {
      pts.car = { lat: s.carLat, lng: s.carLng };
      const rot = num(s.carHeadingDeg) ? s.carHeadingDeg : 0;
      const html = '<div class="mk-car"><svg viewBox="0 0 16 16" style="transform:rotate(' + rot + 'deg)"><path d="M8 1 L14 14 L8 11 L2 14 Z"/></svg></div>';
      const icon = L.divIcon({ className: "", html, iconSize: [30, 30], iconAnchor: [15, 15] });
      if (!carM) carM = L.marker([s.carLat, s.carLng], { icon, interactive: false }).addTo(map);
      else { carM.setLatLng([s.carLat, s.carLng]); carM.setIcon(icon); }
    }
    if (num(s.pickupLat) && num(s.pickupLng)) {
      pts.pick = { lat: s.pickupLat, lng: s.pickupLng };
      const lab = s.pickupLabel ? "<i></i>" : "";
      const icon = L.divIcon({ className: "", html: '<div class="mk-pick">' + lab + "</div>", iconSize: [24, 24], iconAnchor: [12, 12] });
      if (!pickM) pickM = L.marker([s.pickupLat, s.pickupLng], { icon, interactive: false }).addTo(map);
      else { pickM.setLatLng([s.pickupLat, s.pickupLng]); pickM.setIcon(icon); }
      if (s.pickupLabel) { const i = pickM.getElement() && pickM.getElement().querySelector("i"); if (i) i.textContent = s.pickupLabel; }
    }
    const ver = Number.isInteger(s.pickupVersion) ? s.pickupVersion : null;
    const bumped = ver !== null && lastPickVer !== null && ver > lastPickVer;
    if (ver !== null) lastPickVer = ver;
    fit(bumped);
  }
  function setSelf(lat, lng, acc) {
    pts.me = { lat, lng };
    selfFix = { lat, lng };
    renderChips();
    if (!map) return;
    if (!meM) {
      meM = L.marker([lat, lng], { icon: L.divIcon({ className: "", html: '<div class="mk-me"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }), interactive: false }).addTo(map);
      meC = L.circle([lat, lng], { radius: num(acc) ? acc : 0, color: cssVar("--color-ink"), weight: 1, fillColor: cssVar("--color-ink"), fillOpacity: 0.12, interactive: false }).addTo(map);
    } else { meM.setLatLng([lat, lng]); meC.setLatLng([lat, lng]); meC.setRadius(num(acc) ? acc : 0); }
    fit(false);
  }
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let selfFix = null;

  // ---- copy by state ----
  function applyState(s) {
    if (!s || shredded) return;
    last = s;
    el.live.textContent = "연결됨"; el.live.classList.add("on");
    const parked = s.stoppedInPark === true;
    const stopped = parked && (s.phase === "STEP4_CURBSIDE_STOPPED" || s.phase === "STEP5_BOARDING_WELCOME");
    stoppedNow = stopped;
    const d = num(s.distanceBucketMeters) ? s.distanceBucketMeters : null;
    const lm = s.landmarkSignboard || "";
    let h, sub, kind = "";
    if (s.trafficSideDoorOpen) {
      kind = "stop"; h = "그 문은 차도 쪽이에요"; sub = "인도 쪽 오른쪽 문으로 타 주세요. 뒤에서 오토바이가 올 수 있어요.";
    } else if (s.welcomeGreetingActive || s.passengerSeated) {
      kind = "go"; h = (s.passengerName || "동승자") + "님, 반갑습니다"; sub = "안전벨트를 매면 이 링크는 사라집니다.";
    } else if (s.boardingDoorUnlocked && stopped) {
      kind = "go"; h = "지금 타도 돼요"; sub = "운전자가 주변을 확인했어요. 인도 쪽 오른쪽 문으로 타세요.";
    } else if (stopped) {
      h = "차가 멈췄어요"; sub = "운전자가 주변을 확인하는 중이에요. 문이 열리면 알려 드릴게요.";
    } else {
      h = "차가 오고 있어요";
      const where = lm ? "'" + lm + "' 앞 인도에서 기다려 주세요." : "인도에서 기다려 주세요.";
      sub = d !== null ? d + " m, 약 " + Math.max(1, Math.round(d / 100)) + "분. " + where : where;
    }
    el.say.className = "say" + (kind ? " " + kind : "");
    el.head.textContent = h; el.sub.textContent = sub;
    el.note.hidden = !s.pickupNote; if (s.pickupNote) el.note.textContent = "운전자: " + s.pickupNote;
    el.plate.textContent = s.plateLast4 || "----";
    if (s.vehicleModelLabel) el.model.textContent = s.vehicleModelLabel;
    el.carLine.textContent = stopped ? (d !== null ? d + " m 앞" : "바로 앞에 있어요") : "번호판 끝 4자리를 먼저 확인하세요";
    // facts or chips
    el.chips.hidden = stopped; el.facts.hidden = !stopped;
    if (stopped) {
      let dt = "잠김", dc = "";
      if (s.trafficSideDoorOpen) { dt = "차도 쪽 열림"; dc = "bad"; }
      else if (s.passengerDoorOpen) { dt = "열림"; dc = "ok"; }
      else if (s.boardingDoorUnlocked) { dt = "잠금 해제됨"; dc = "ok"; }
      el.fDoor.textContent = dt; el.fDoor.className = dc;
      el.fBelt.textContent = s.passengerBuckled ? "체결" : (s.passengerSeated ? "앉음, 미체결" : "아직 없음");
      el.fBelt.className = s.passengerBuckled ? "ok" : "";
    }
    renderChips();
    updateMarkers(s);
  }

  // ---- suggestions ----
  let lastSent = null, lockUntil = 0, failed = false, lockTimer = null;
  function renderChips() {
    const locked = Date.now() < lockUntil;
    const reply = lastSent && last.suggestionReplyId === lastSent.id ? last.suggestionReply : null;
    el.chips.querySelectorAll(".chip").forEach((b) => {
      const k = b.dataset.kind, mine = lastSent && lastSent.kind === k;
      const needFix = k === "PICKUP_HERE" && !selfFix;
      b.disabled = locked || needFix;
      b.classList.toggle("sent", !!mine);
      b.querySelector("span").textContent = mine ? (reply === "ACCEPTED" ? "운전자가 수락했어요" : reply === "DECLINED" ? "운전자가 거절했어요" : "보냈어요") : "";
    });
    const pickNeedsFix = !selfFix;
    el.chipHint.hidden = !(failed || pickNeedsFix);
    el.chipHint.className = "small" + (failed ? " err" : "");
    el.chipHint.textContent = failed ? "전달하지 못했어요. 다시 눌러 주세요." : "내 위치를 아직 못 잡았어요";
  }
  el.chips.addEventListener("click", (ev) => {
    const b = ev.target.closest(".chip");
    if (!b || b.disabled) return;
    const kind = b.dataset.kind;
    const body = { kind, text: b.firstChild.textContent };
    if (kind === "PICKUP_HERE" && selfFix) { body.lat = selfFix.lat; body.lng = selfFix.lng; }
    if (kind === "WAIT_MINUTES") body.minutes = 2;
    failed = false;
    fetch(withToken("/suggest"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then((r) => { if (!r.ok) throw new Error("x"); return r.json(); })
      .then((j) => {
        lastSent = { kind, id: j.id }; lockUntil = Date.now() + 20000;
        clearTimeout(lockTimer); lockTimer = setTimeout(renderChips, 20000); renderChips();
      })
      .catch(() => { failed = true; lockUntil = 0; renderChips(); });
  });

  // ---- geolocation ----
  let lastPost = 0, lastPosted = null;
  function onPos(p) {
    el.locBox.hidden = true;
    const c = p.coords, acc = num(c.accuracy) ? c.accuracy : null;
    setSelf(c.latitude, c.longitude, acc);
    const now = Date.now();
    const moved = !lastPosted || dist(lastPosted, { lat: c.latitude, lng: c.longitude }) > 3;
    const accChg = lastPosted && acc !== null && lastPosted.acc !== null && Math.abs(acc - lastPosted.acc) > 5;
    if (now - lastPost < 2000 || !(moved || accChg) || shredded) return;
    lastPost = now; lastPosted = { lat: c.latitude, lng: c.longitude, acc };
    fetch(withToken("/passenger-location"), { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ lat: c.latitude, lng: c.longitude, accuracyM: acc }) }).catch(() => {});
  }
  const onPosErr = () => { el.locBox.hidden = shredded; };
  function startGeo() {
    if (!navigator.geolocation) { onPosErr(); return; }
    navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }
  el.locBtn.addEventListener("click", () => {
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(onPos, onPosErr, { enableHighAccuracy: true, timeout: 20000 });
  });

  // ---- shredded ----
  function showShredded() {
    shredded = true;
    el.mapWrap.hidden = true; el.chips.hidden = true; el.facts.hidden = true; el.chipHint.hidden = true; el.locBox.hidden = true;
    el.say.className = "say"; el.head.textContent = "안전하게 탑승했습니다";
    el.sub.textContent = "탑승 확인과 동시에 공유 링크와 위치 정보가 서버에서 삭제되었습니다.";
    el.note.hidden = true;
    el.live.textContent = "공유 종료"; el.live.classList.remove("on");
  }

  // test and replay hooks (no effect on production flow)
  window.__majungApplyState = applyState;
  window.__majungShowShredded = showShredded;
  window.__majungSetSelf = (lat, lng, acc) => { if (num(lat) && num(lng) && !shredded) setSelf(lat, lng, acc); };

  applyState({});
  el.live.textContent = "연결 끊김"; el.live.classList.remove("on");
  const dLat = parseFloat(qs.get("demoLat")), dLng = parseFloat(qs.get("demoLng"));
  // demoLat/demoLng: a browser without a position fix (demo, capture) behaves like one fix at that spot, so the car sees it too
  if (isFinite(dLat) && isFinite(dLng)) onPos({ coords: { latitude: dLat, longitude: dLng, accuracy: 12 } }); else startGeo();

  try {
    const es = new EventSource(withToken("/events"));
    es.onopen = () => { if (!shredded) { el.live.textContent = "연결됨"; el.live.classList.add("on"); } };
    es.addEventListener("STATE_UPDATE", (ev) => { try { applyState(JSON.parse(ev.data)); } catch (_) {} });
    es.addEventListener("SESSION_SHREDDED", () => { es.close(); showShredded(); });
    es.onerror = () => {
      if (!shredded) { el.live.textContent = "연결 끊김"; el.live.classList.remove("on"); }
      fetch(withToken("")).then((r) => { if (r.status === 404 && sessionId !== "demo-session") { es.close(); showShredded(); } }).catch(() => {});
    };
  } catch (_) {}
})();
</script>
</body>
