<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>마중 시연 영상 합성 (1920×1080 · t 기반 결정적 렌더링)</title>
<style>
  /* 현대 브랜드 톤: Hyundai Blue #002C5F · Active Blue #00AAD2 · Sand #E4DCD3 · 로고/전용서체 미사용 */
  :root { --blue:#002C5F; --active:#00AAD2; --sand:#E4DCD3; --ink:#0B0F14; --muted:#9AA4B2; --white:#F5F7FA; --danger:#E63312; --success:#2FBF71; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  .brandbar { position: absolute; left: 72px; top: 44px; display: flex; align-items: center; gap: 14px; z-index: 5; }
  .brandbar b { font-size: 34px; letter-spacing: -0.02em; }
  .brandbar span { font-size: 15px; color: var(--muted); letter-spacing: .18em; font-weight: 700; }
  .brandbar .pill { font-size: 14px; font-weight: 700; color: var(--ink); background: var(--active); padding: 6px 14px; border-radius: 999px; letter-spacing: 0; }
  .credit { position: absolute; right: 72px; bottom: 36px; font-size: 16px; color: var(--muted); z-index: 5; }

  .title, .end { text-align: center; }
  .title .mark, .end .mark { position: absolute; left: 50%; top: 300px; width: 148px; height: 148px; margin-left: -74px; }
  .title h1, .end h1 { position: absolute; left: 0; right: 0; top: 490px; font-size: 132px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .title p, .end p { position: absolute; left: 0; right: 0; top: 668px; font-size: 40px; color: var(--muted); font-weight: 500; letter-spacing: -0.02em; }

  /* 데모 장면 (여러 개): IVI 녹화 + 동승자 웹 */
  .demo .ivi { position: absolute; left: 56px; border-radius: 24px; overflow: hidden; background: #000; border: 1px solid #2A333F; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .demo .ivi video { display: block; object-fit: cover; }
  .demo .ivi .tag { position: absolute; left: 20px; top: 16px; background: rgba(11,15,20,.78); border: 1px solid #2A333F; color: var(--white); font-size: 16px; font-weight: 700; padding: 8px 14px; border-radius: 999px; }
  .demo .ivi .tag.real { background: rgba(0,170,210,.92); color: var(--ink); border-color: transparent; }
  .demo .phone { position: absolute; left: 1398px; top: 118px; width: 430px; height: 862px; border-radius: 48px; background: #111; border: 10px solid #1C2430; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .demo .phone iframe { width: 410px; height: 842px; border: 0; display: block; background: #F5F7FA; }
  .demo .phone .tag { position: absolute; left: 50%; transform: translateX(-50%); bottom: 16px; background: rgba(0,44,95,.92); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .caption { position: absolute; left: 56px; bottom: 60px; width: 1284px; display: flex; align-items: center; gap: 18px; opacity: 0; transform: translateY(16px); }
  .caption .n { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--active); color: var(--ink); font-weight: 800; font-size: 26px; display: flex; align-items: center; justify-content: center; }
  .caption .t { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .caption .t small { display: none; }
  .steps { position: absolute; right: 580px; bottom: 76px; display: flex; gap: 10px; }
  .steps i { width: 34px; height: 6px; border-radius: 3px; background: #2A333F; }
  .steps i.on { background: var(--active); }
  .demo .ivi .tag, .demo .phone .tag { display: none; }
  .brandbar, .credit { transition: none; }
  .signal { position: absolute; left: 56px; top: 94px; display: flex; gap: 10px; }
  /* 켜진 라벨만 자리를 차지한다 (꺼진 라벨이 폭을 차지하면 뒤쪽 라벨이 IVI 박스 밖으로 밀려난다) */
  .signal span { display: none; font-family: "SF Mono", Menlo, monospace; font-size: 15px; color: #7FB7D9; background: rgba(11,15,20,.85); border: 1px solid #2A333F; padding: 6px 12px; border-radius: 999px; }
  .signal span.on { display: inline-block; }

</style>
</head>
<body>
<div id="stage">
  <div class="brandbar"><svg width="40" height="40" viewBox="0 0 72 72" aria-hidden="true"><rect width="72" height="72" rx="18" fill="#003984"/><path d="M19 21h34M36 25.5 23.5 51M36 25.5 48.5 51" fill="none" stroke="#FCFDFE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><b>마중</b><span>MAJUNG</span><span class="pill" id="pill">Pleos Connect 차량용 앱</span></div>
  <div class="credit" id="credit">현대자동차그룹 차량용 앱 개발 공모전 · 시연 영상</div>

  <section class="layer title" id="L-title">
    <svg class="mark" viewBox="0 0 72 72" aria-hidden="true"><rect width="72" height="72" rx="18" fill="#003984"/><path d="M19 21h34M36 25.5 23.5 51M36 25.5 48.5 51" fill="none" stroke="#FCFDFE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>마중</h1>
    <p>차량 신호로 확인하는 안심 픽업</p>
  </section>

  <div id="demos"></div>

  <section class="layer end" id="L-end">
    <svg class="mark" viewBox="0 0 72 72" aria-hidden="true"><rect width="72" height="72" rx="18" fill="#003984"/><path d="M19 21h34M36 25.5 23.5 51M36 25.5 48.5 51" fill="none" stroke="#FCFDFE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>마중</h1>
    <p>차량이 확인해 주는 마지막 100m</p>
  </section>
</div>

<script>
const Q = new URLSearchParams(location.search);
const TL = { scenes: {}, demos: [] };
window.__ready = false;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const fade = (el, t, start, end, inMs = 500, outMs = 500) => {
  let o = 0;
  if (t >= start && t <= end) o = Math.min(ease((t - start) / inMs), ease((end - t) / outMs));
  el.style.opacity = o.toFixed(3);
  return o;
};
const rise = (el, t, at, dur = 600) => { const p = ease((t - at) / dur); el.style.opacity = p.toFixed(3); el.style.transform = `translateY(${(1 - p) * 40}px)`; };
const $ = (id) => document.getElementById(id);

function buildDemo(d, i) {
  const box = d.box || { w: 1284, h: 722, top: 150 };
  const sec = document.createElement("section"); sec.className = "layer demo"; sec.id = `L-demo${i}`;
  sec.innerHTML = `
    <div class="signal" id="sig${i}"></div>
    <div class="ivi" style="top:${box.top}px;width:${box.w}px;height:${box.h}px"><video id="rec${i}" muted playsinline preload="auto" style="width:${box.w}px;height:${box.h}px"></video><div class="tag ${d.real ? "real" : ""}">${d.tag || ""}</div></div>
    <div class="phone"><iframe id="web${i}" src="about:blank"></iframe><div class="tag">동승자 무설치 웹 · 실시간 중계 상태 재생</div></div>
    <div class="caption" id="cap${i}"><div class="n" id="capn${i}">1</div><div class="t" id="capt${i}">&nbsp;<small id="caps${i}"></small></div></div>
    <div class="steps" id="steps${i}">${"<i></i>".repeat(d.stepCount || 7)}</div>`;
  $("demos").appendChild(sec);
  return sec;
}

async function init() {
  try {
    const tl = await fetch(Q.get("timeline") || "timeline.json").then((r) => r.json());
    Object.assign(TL, tl);
    for (let i = 0; i < TL.demos.length; i++) {
      const d = TL.demos[i]; buildDemo(d, i);
      const v = $(`rec${i}`); v.src = d.video;
      await new Promise((r, j) => { v.onloadedmetadata = r; v.onerror = () => j(new Error("video load error " + d.video)); v.load(); });
      const w = $(`web${i}`); w.src = (TL.web || "web.html") + (TL.webQuery || "");
      await new Promise((r) => { w.onload = r; });
    }
    window.__ready = true;
  } catch (e) { window.__initError = String(e); }
}

function seekVideo(v, local) {
  if (!isFinite(v.duration)) return Promise.resolve();
  const t = clamp(local, 0, Math.max(0, v.duration - 0.05));
  if (Math.abs(v.currentTime - t) < 0.005) return Promise.resolve();
  return new Promise((r) => {
    const done = () => { v.removeEventListener("seeked", done); clearTimeout(tm); r(); };
    const tm = setTimeout(done, 3000);
    v.addEventListener("seeked", done); v.currentTime = t;
  });
}

function applyWebState(i, d, rel) {
  const w = $(`web${i}`).contentWindow; if (!w) return;
  let last = null; let shredded = false;
  for (const st of d.webStates) { if (st.t <= rel) { if (st.event === "SESSION_SHREDDED") shredded = true; else last = st.data; } }
  if (shredded) { w.__majungShowShredded && w.__majungShowShredded(); return; }
  if (last && w.__majungApplyState) w.__majungApplyState(last);
  // 자리 고르기 핀(t0~t1) → 보낸 자리(t1~tEnd) → 수락 뒤 제거
  if (d.pick && w.__majungPickPreview) {
    const ph = rel < d.pick.t0 ? "off" : rel < d.pick.t1 ? "pin" : rel < d.pick.tEnd ? "proposed" : "off";
    w.__majungPickPreview(ph, d.pick.lat, d.pick.lng);
  }
}

window.__seek = async (ms) => {
  const S = TL.scenes;
  fade($("L-title"), ms, S.title.start, S.title.end, 700, 500);
  fade($("L-end"), ms, S.end.start, S.end.end, 700, 900);
  const bare = ms < S.title.end || ms >= S.end.start;
  document.querySelector(".brandbar").style.opacity = bare ? 0 : 1; $("credit").style.opacity = bare ? 0 : 1;

  for (let i = 0; i < TL.demos.length; i++) {
    const d = TL.demos[i]; const sc = S[d.scene];
    const o = fade($(`L-demo${i}`), ms, sc.start, sc.end, 500, 500);
    if (o <= 0) continue;
    const rel = ms - sc.start;
    await seekVideo($(`rec${i}`), (rel + (d.offsetMs || 0)) / 1000 + (d.videoStartSec || 0));
    applyWebState(i, d, rel);
    let c = null; for (const cap of d.captions) if (rel >= cap.t) c = cap;
    const capEl = $(`cap${i}`);
    [...$(`steps${i}`).children].forEach((el, k) => el.classList.toggle("on", !!c && k < c.n));
    if (c) { $(`capn${i}`).textContent = c.n; $(`capt${i}`).firstChild.textContent = c.title; $(`caps${i}`).textContent = c.sub; rise(capEl, ms, sc.start + c.t, 400); } else capEl.style.opacity = 0;
    const sig = $(`sig${i}`); if (!sig.childElementCount) for (const e of d.events) { const sp = document.createElement("span"); sp.textContent = e.label; sig.appendChild(sp); }
    [...sig.children].forEach((sp, k) => { const e = d.events[k]; sp.classList.toggle("on", rel >= e.t && rel <= e.t + (e.hold || 6000)); });
  }
  const active = TL.demos.find((d) => ms >= S[d.scene].start && ms < S[d.scene].end);
  $("pill").textContent = active ? (active.pill || "실제 앱 녹화") : "Pleos Connect 차량용 앱";
  $("credit").textContent = active ? (active.credit || "") : "";
  return true;
};
init();
</script>
</body>
</html>
